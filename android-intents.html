<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Android App Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    background: #f2f2f2;
    padding: 20px;
  }
  .btn {
    display: block;
    padding: 16px;
    margin: 12px 0;
    background: white;
    border-radius: 10px;
    text-decoration: none;
    color: #000;
    font-size: 18px;
    box-shadow: 0 2px 5px rgba(0,0,0,.15);
  }
  .disabled {
    color: red;
    font-weight: bold;
  }
</style>

<script>
  if (!/Android/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<p class='disabled'>❌ This page only works on Android devices.</p>";
  }
</script>
</head>

<body>

<h2>Android Intent Launcher</h2>

<!-- Chrome -->
<a class="btn"
href="intent://www.google.com#Intent;
scheme=https;
package=com.android.chrome;
S.browser_fallback_url=https://www.google.com;
end">
🌐 Open Google in Chrome
</a>

<!-- Settings -->
<a class="btn"
href="intent://settings#Intent;
action=android.settings.SETTINGS;
end">
⚙️ Open Android Settings
</a>

<!-- YouTube -->
<a class="btn"
href="intent://www.youtube.com#Intent;
scheme=https;
package=com.google.android.youtube;
S.browser_fallback_url=https://www.youtube.com;
end">
▶️ Open YouTube App
</a>

  <a class="intent-link" href="intent://www.youtube.com#Intent;package=com.google.android.youtube;scheme=https;end">
  Open YouTube
</a>

<a class="intent-link" href="https://play.google.com/store/apps/details?id=com.android.chrome">
  Open Chrome (via Play Store)
</a>

<a class="intent-link" href="https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.files">
  Open File Manager (Files by Google)
</a>

<a class="intent-link" href="https://play.google.com/store/apps/details?id=com.android.settings">
  Open Settings (fallback only)
</a>
</body>
</html>
